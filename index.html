<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò Chơi Thử Thách - Party Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc;
        }
        
        /* Hiệu ứng Glow nhẹ cho thẻ chính */
        .glow-card {
            box-shadow: 0 0 40px -10px rgba(99, 102, 241, 0.15);
        }

        /* Tùy chỉnh thanh cuộn cho JSON textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        textarea::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        
        /* Vô hiệu hóa bôi đen văn bản trên giao diện Game */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="min-h-screen antialiased flex flex-col relative selection:bg-indigo-500 selection:text-white">

    <div class="fixed top-0 left-0 w-[50px] h-[50px] z-50 cursor-default" onclick="toggleCheat()"></div>
    
    <!-- Chấm đỏ báo hiệu ẩn/hiện -->

    <!-- MÀN HÌNH SETUP -->

        <div class="glow-card w-full max-w-2xl bg-slate-800/80 backdrop-blur-xl border border-slate-700 rounded-3xl p-6 sm:p-10 relative z-10">

                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-400 mb-2 uppercase tracking-wider">Người Chơi 2 (Đối thủ)</label>
                    <input type="text" id="p2-name" value="Người chơi 2" class="w-full bg-slate-900/50 border border-slate-700 text-white px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all font-semibold">
                </div>
            </div>

            <div class="mb-8">
                <label class="block text-sm font-semibold text-slate-400 mb-2 uppercase tracking-wider flex justify-between items-end">
                    <span>Dữ liệu JSON</span>
                </label>
                <textarea id="json-input" rows="12" class="w-full bg-slate-900/80 border border-slate-700 text-slate-300 px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all font-mono text-xs sm:text-sm resize-y leading-relaxed"></textarea>

                    JSON không hợp lệ. Vui lòng kiểm tra lại!
                </p>
            </div>

                Bắt Đầu Trò Chơi
            </button>

            <div class="flex flex-col items-start">

                <div id="ui-p1-name" class="text-base sm:text-xl font-black text-cyan-400 drop-shadow-sm">Người chơi 1</div>
            </div>
            <div class="text-xs sm:text-sm font-black text-slate-500 bg-slate-900/80 px-4 py-1.5 rounded-full uppercase tracking-widest border border-slate-700 shadow-inner">VS</div>

                <div id="ui-p2-name" class="text-base sm:text-xl font-black text-rose-400 drop-shadow-sm">Người chơi 2</div>
            </div>
        </div>

            <!-- Lượt của ai -->

            </div>

            <div id="probability-bar" class="px-6 py-3 bg-gradient-to-r from-slate-800 to-slate-900 border-b border-slate-700/50 flex justify-center items-center gap-2 transition-colors duration-300">

                    Đang bốc thăm...
                </h2>

    <!-- MODAL HÌNH PHẠT -->

        function toggleCheat() {
            isCheatMode = !isCheatMode;
            
            // Nếu bật, hiển thị chấm đỏ 1.5s rồi ẩn đi để giữ bí mật
            if (isCheatMode) {
                const indicator = document.getElementById('cheat-indicator');
                indicator.classList.remove('hidden');
                
                // Xóa timeout cũ nếu có bấm liên tục
                if (cheatTimeout) clearTimeout(cheatTimeout);
                
                cheatTimeout = setTimeout(() => {
                    indicator.classList.add('hidden');
                }, 1500);
            }
        }

        function startGame() {
            p1 = document.getElementById('p1-name').value.trim() || "Người chơi 1";
            p2 = document.getElementById('p2-name').value.trim() || "Người chơi 2";
            
            const rawJson = document.getElementById('json-input').value;
            try {
                gameData = JSON.parse(rawJson);
                document.getElementById('json-error').classList.add('hidden');
                
                // Đổi UI sang màn hình Game
                document.getElementById('setup-screen').classList.add('hidden');
                const gameScreen = document.getElementById('game-screen');
                gameScreen.classList.remove('hidden');
                gameScreen.classList.add('flex');
                
                document.getElementById('ui-p1-name').innerText = p1;
                document.getElementById('ui-p2-name').innerText = p2;

                // Reset state
                currentPlayerNum = 1;
                p1SpecialUsed = false;
                p2SpecialUsed = false;

                startTurn();

            } catch (e) {
                document.getElementById('json-error').classList.remove('hidden');
            }
        }

        function startTurn() {
            // Cập nhật giao diện người đang chơi
            const currentName = currentPlayerNum === 1 ? p1 : p2;
            const pDisplay = document.getElementById('current-player-display');
            pDisplay.innerText = currentName;
            
            if(currentPlayerNum === 1) {
                pDisplay.className = "text-sm sm:text-base font-black px-4 py-1.5 rounded-full shadow-inner bg-cyan-900/40 text-cyan-400 border border-cyan-800/50";
            } else {
                pDisplay.className = "text-sm sm:text-base font-black px-4 py-1.5 rounded-full shadow-inner bg-rose-900/40 text-rose-400 border border-rose-800/50";
            }

            // Kiểm tra trạng thái dính special
            let hasUsedSpecial = (currentPlayerNum === 1) ? p1SpecialUsed : p2SpecialUsed;

            // 1. Sinh "Tỉ lệ xuất hiện Special Challenge" UI
            let visualChance = Math.floor(Math.random() * 80) + 1; // Random 1-80%
            
            // Nếu người này ĐÃ từng dính Special, tỉ lệ thực và hiển thị phải bằng 0% (Luật mới)
            if (hasUsedSpecial) {
                visualChance = 0;
            }
            
            // Cập nhật UI thanh tỉ lệ
            const probUi = document.getElementById('special-chance-ui');
            const probBar = document.getElementById('probability-bar');
            probUi.innerText = visualChance + '%';
            
            if (visualChance === 0) {
                probUi.className = "font-black text-slate-500 text-sm bg-slate-800 px-2 py-0.5 rounded shadow-inner";
                probBar.className = "px-6 py-3 bg-slate-900/80 border-b border-slate-700/50 flex justify-center items-center gap-2 transition-colors duration-300";
            } else {
                probUi.className = "font-black text-amber-400 text-sm bg-amber-900/60 px-2 py-0.5 rounded shadow-inner animate-pulse";
                probBar.className = "px-6 py-3 bg-gradient-to-r from-amber-900/20 to-orange-900/20 border-b border-amber-800/30 flex justify-center items-center gap-2 transition-colors duration-300";
            }

            // 2. Logic Bốc thăm sự kiện
            let eventType = 'challenge'; 
            let pool = [];

            if (isCheatMode) {
                // ==================== CHEAT MODE BẬT ====================
                if (currentPlayerNum === 1) {
                    // MÌNH (P1): 0% Special, chỉ bốc Normal Easy (Intensity <= 4)
                    eventType = 'challenge';
                    let easyPool = gameData.challenges.filter(c => c.intensity <= 4);
                    if (easyPool.length > 0) {
                        pool = easyPool;
                    } else {
                        // Fallback nếu JSON k có đồ dễ -> Lấy cái dễ nhất trong mảng
                        pool = [...gameData.challenges].sort((a,b) => a.intensity - b.intensity).slice(0, 1);
                    }
                } else {
                    // ĐỐI THỦ (P2)
                    if (!p2SpecialUsed) {
                        // Chưa bị special -> Ép 100% dính Special
                        eventType = 'special_challenge';
                    } else {
                        // Đã bị special -> 0% Special, Ép 100% Normal Hard (Intensity >= 7)
                        eventType = 'challenge';
                        let hardPool = gameData.challenges.filter(c => c.intensity >= 7);
                        if (hardPool.length > 0) {
                            pool = hardPool;
                        } else {
                            // Fallback nếu JSON k có đồ khó -> Lấy cái khó nhất
                            pool = [...gameData.challenges].sort((a,b) => b.intensity - a.intensity).slice(0, 1);
                        }
                    }
                }
            } else {
                // ==================== CHƠI BÌNH THƯỜNG (CHEAT TẮT) ====================
                if (visualChance > 0) {
                    let roll = Math.random() * 100;
                    if (roll <= visualChance) {
                        eventType = 'special_challenge';
                    } else if (roll <= visualChance + 10) { 
                        // 10% cơ hội rơi vào opportunity
                        eventType = 'opportunity';
                    } else {
                        eventType = 'challenge';
                    }
                } else {
                    // Nếu visualChance = 0 (tức là đã xài special rồi)
                    let roll = Math.random() * 100;
                    if (roll <= 15) { // 15% vào opportunity nếu đã mất quyền special
                        eventType = 'opportunity';
                    } else {
                        eventType = 'challenge';
                    }
                }
            }

            // Kiểm tra fallback cho pool dữ liệu
            if (eventType === 'opportunity' && (!gameData.opportunities || gameData.opportunities.length === 0)) eventType = 'challenge';
            if (eventType === 'special_challenge' && (!gameData.special_challenges || gameData.special_challenges.length === 0)) eventType = 'challenge';

            // Gán dữ liệu cho pool
            if (eventType === 'challenge' && pool.length === 0) pool = [...gameData.challenges]; // Normal pool
            else if (eventType === 'opportunity') pool = [...gameData.opportunities];
            else if (eventType === 'special_challenge') pool = [...gameData.special_challenges];

            // Bốc ngẫu nhiên 1 sự kiện
            currentEvent = pool[Math.floor(Math.random() * pool.length)];
            currentEvent.type = eventType;

            // Đánh dấu đã dùng Special
            if (eventType === 'special_challenge') {
                if (currentPlayerNum === 1) p1SpecialUsed = true;
                else p2SpecialUsed = true;
            }

            renderEventUI();
        }

        function renderEventUI() {
            const badge = document.getElementById('event-type-badge');
            const title = document.getElementById('event-title');
            const intensity = document.getElementById('event-intensity');
            const material = document.getElementById('event-material');
            const extra = document.getElementById('event-extra');
            const card = document.getElementById('challenge-card');

            // Reset trạng thái element
            intensity.classList.remove('hidden');
            material.classList.add('hidden');
            extra.classList.add('hidden');
            
            // Xóa class style cũ của card
            card.className = "w-full max-w-md bg-slate-800 rounded-[2rem] overflow-hidden border flex flex-col relative z-10 transition-all duration-500 glow-card";

            if (currentEvent.type === 'opportunity') {
                badge.innerText = "CƠ HỘI ĐẶC BIỆT ✨";
                badge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest mb-6 mx-auto w-max bg-emerald-500/20 text-emerald-400 border border-emerald-500/50";
                title.innerText = currentEvent.description;
                title.className = "text-2xl sm:text-3xl font-black text-emerald-300 mb-6 leading-tight drop-shadow-md";
                card.classList.add('border-emerald-900/50', 'shadow-[0_0_40px_-10px_rgba(16,185,129,0.2)]');
            } 
            else if (currentEvent.type === 'special_challenge') {
                badge.innerText = "THỬ THÁCH ĐẶC BIỆT 🔥";
                badge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest mb-6 mx-auto w-max bg-amber-500/20 text-amber-400 border border-amber-500/50 shadow-[0_0_15px_rgba(245,158,11,0.2)] animate-pulse";
                title.innerText = currentEvent.challenge;
                title.className = "text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-br from-amber-200 to-orange-500 mb-6 leading-tight drop-shadow-lg";
                card.classList.add('border-amber-900/50', 'shadow-[0_0_40px_-10px_rgba(245,158,11,0.2)]');
                
                if (currentEvent.fail_condition) {
                    extra.innerText = `⚠️ Nhấn KHÔNG PASS nếu: ${currentEvent.fail_condition}`;
                    extra.classList.remove('hidden');
                }
            } 
            else {
                badge.innerText = "THỬ THÁCH THƯỜNG";
                badge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest mb-6 mx-auto w-max bg-blue-500/20 text-blue-400 border border-blue-500/30";
                title.innerText = currentEvent.challenge;
                title.className = "text-2xl sm:text-3xl font-black text-white mb-6 leading-tight drop-shadow-md";
                card.classList.add('border-slate-700');
                
                let mat = currentEvent.material || gameData.material;
                if (mat && mat.trim() !== "" && mat.toLowerCase() !== "không" && mat.toLowerCase() !== "không có") {
                    material.innerText = `Dụng cụ: ${mat}`;
                    material.classList.remove('hidden');
                }
            }

            // Gắn class màu cho Độ khó
            let intColor = 'bg-cyan-500/20 text-cyan-400 border-cyan-500/50';
            if (currentEvent.intensity >= 5 && currentEvent.intensity <= 7) {
                intColor = 'bg-orange-500/20 text-orange-400 border-orange-500/50';
            } else if (currentEvent.intensity >= 8) {
                intColor = 'bg-rose-500/20 text-rose-400 border-rose-500/50';
            }
            intensity.className = `px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider flex items-center shadow-inner border ${intColor}`;
            intensity.innerText = `Độ khó: ${currentEvent.intensity}/10`;
        }

        function handlePass() {
            nextTurn();
        }

        function handleNoPass() {
            // Kiểm tra thuộc tính fail: true -> Game over ngay lập tức
            if (currentEvent.fail === true) {
                const winner = currentPlayerNum === 1 ? p2 : p1;
                const loser = currentPlayerNum === 1 ? p1 : p2;
                let reason = `${loser} đã thất bại ở một thử thách CHÍ MẠNG.`;
                if (currentEvent.fail_condition) {
                    reason = `${loser} đã dính điều kiện thua: "${currentEvent.fail_condition}".`;
                }
                triggerGameOver(winner, reason);
            } else {
                // fail: false -> Hiện hình phạt bình thường
                let punishmentText = currentEvent.punishment || ".";
                document.getElementById('punishment-text').innerText = punishmentText;
                document.getElementById('punishment-modal').classList.remove('hidden');
            }
        }

        function closePunishmentAndNextTurn() {
            document.getElementById('punishment-modal').classList.add('hidden');
            nextTurn();
        }

        function nextTurn() {
            // Đổi người chơi
            currentPlayerNum = currentPlayerNum === 1 ? 2 : 1;
            
            // Hiệu ứng Loading nhẹ chuyển lượt
            document.getElementById('event-title').innerText = "Đang lấy yêu cầu...";
            document.getElementById('event-type-badge').innerText = "...";
            document.getElementById('event-intensity').classList.add('hidden');
            document.getElementById('event-material').classList.add('hidden');
            document.getElementById('event-extra').classList.add('hidden');
            document.getElementById('special-chance-ui').innerText = '--%';
            
            setTimeout(() => {
                startTurn();
            }, 500);
        }

        function triggerGameOver(winnerName, reason) {
            document.getElementById('winner-name').innerText = winnerName;
            document.getElementById('loser-reason').innerText = reason;
            document.getElementById('gameover-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
